<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Shri Janki Nath Bada Mandir: Charan Paduka on lotus with tilak -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#ffe7c2"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffac4b"/>
      <stop offset="100%" stop-color="#f16f23"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0353f"/>
      <stop offset="100%" stop-color="#9e1238"/>
    </linearGradient>
    <g id="foot">
      <!-- sole -->
      <path d="M0-13C6.5-13 8.8-6 8.2 3.5 7.6 13.5 5 21.5 0 21.5S-7.6 13.5-7.4 3.5C-7.6-6-6.5-13 0-13Z"
            fill="#fff" stroke="#8b1e3f" stroke-width="1.6"/>
      <!-- toes (big toe on the inner side) -->
      <g fill="#fff" stroke="#8b1e3f" stroke-width="1.3">
        <circle cx="-3.8" cy="-15.6" r="3.3"/>
        <circle cx="1.6" cy="-16.4" r="2.3"/>
        <circle cx="5.2" cy="-14.6" r="2"/>
        <circle cx="7.6" cy="-11.6" r="1.7"/>
        <circle cx="9" cy="-8.2" r="1.4"/>
      </g>
      <!-- auspicious marks: urdhva rekha, chakra, small lotus -->
      <path d="M0-7V14" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="-3" r="2.4" fill="none" stroke="#f16f23" stroke-width="1"/>
      <path d="M-2.6 11.5Q0 6.5 2.6 11.5Q0 13.5-2.6 11.5Z" fill="#f16f23"/>
    </g>
  </defs>

  <!-- Badge -->
  <circle cx="60" cy="60" r="57" fill="url(#bg)" stroke="#f16f23" stroke-width="4"/>
  <circle cx="60" cy="60" r="50.5" fill="none" stroke="#ffac4b" stroke-width="1.2" stroke-dasharray="2 2.6"/>

  <!-- Charan Paduka (holy feet) -->
  <use href="#foot" transform="translate(81 54) rotate(4)"/>
  <use href="#foot" transform="translate(39 54) scale(-1 1) rotate(4)"/>

  <!-- Central tilak flame with Shri -->
  <path d="M60 22C67 34 71.5 46 68 58 66 65 54 65 52 58 48.5 46 53 34 60 22Z"
        fill="url(#flame)" stroke="#6e0f2a" stroke-width="1"/>
  <path d="M60 33C63 41 64 48 62 55 61 58 59 58 58 55 56 48 57 41 60 33Z" fill="#ffd34d"/>
  <circle cx="60" cy="44" r="2" fill="#2f8f4e"/>

  <!-- Lotus base -->
  <g stroke="#c4501b" stroke-width="0.9" fill="url(#petal)">
    <path d="M60 95C42 94 28 88 22 79 32 77 46 81 60 95Z"/>
    <path d="M60 95C78 94 92 88 98 79 88 77 74 81 60 95Z"/>
    <path d="M60 95C46 90 36 80 34 70 45 72 55 82 60 95Z"/>
    <path d="M60 95C74 90 84 80 86 70 75 72 65 82 60 95Z"/>
    <path d="M60 95C52 86 50 76 52 67 58 70 62 70 68 67 70 76 68 86 60 95Z" fill="#ffd9ac"/>
  </g>
  <path d="M30 98H90" stroke="#f16f23" stroke-width="2.4" stroke-linecap="round"/>
</svg>
